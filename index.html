    <!-- Applies the stored UI theme before any CSS paints, so switching to
         Material (see state/uiTheme.ts) never flashes the default frosted
         look first. Inline + synchronous, ahead of Vite's injected stylesheet. -->
    <script>
      try {
        if (localStorage.getItem('linehaul-ui-theme') === 'material') {
          document.documentElement.setAttribute('data-theme', 'material')
        }
      } catch {}
    </script>
    <!-- Applies an activated DLC's own cached title (see state/activeDlc.ts)
         before React ever mounts, so the browser tab never flashes plain
         "Linehaul" first. MainMenu.tsx re-validates this against the real
         DLC list once it's fetched, and reverts it if the DLC is missing. -->
    <script>
      try {
        var storedDlc = JSON.parse(localStorage.getItem('linehaul-active-dlc'))
        if (storedDlc && typeof storedDlc.title === 'string') document.title = storedDlc.title
      } catch {}
    </script>
